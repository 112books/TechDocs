{{- $models := . -}}
<div class="techdoc-model-selector" style="margin: 1.5rem 0; padding: 1rem; background: #F8FAFC; border-radius: 0.5rem;">
  <label style="font-weight: 600; color: #1B2A4A; margin-right: 0.75rem;">{{ i18n "model_selector" }}:</label>
  <select id="modelFilter" onchange="filterByModel(this.value)" style="padding: 0.5rem 1rem; border: 1px solid #E2E8F0; border-radius: 0.375rem;">
    <option value="all">{{ i18n "all_models" }}</option>
    {{ range $models }}
    <option value="{{ . }}">{{ . }}</option>
    {{ end }}
  </select>
</div>
