<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <rect width="500" height="400" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="250" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#1B2A4A" text-anchor="middle">Connexió Elèctrica Trifàsica</text>
  
  <!-- Power source -->
  <rect x="50" y="80" width="100" height="40" rx="5" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="100" y="105" font-family="Arial" font-size="12" fill="#2563EB" text-anchor="middle">230V AC</text>
  
  <!-- Lines L1, L2, L3, N, PE -->
  <line x1="100" y1="120" x2="100" y2="160" stroke="#DC2626" stroke-width="3"/>
  <text x="90" y="140" font-family="Arial" font-size="10" fill="#DC2626" text-anchor="end">L1</text>
  
  <line x1="120" y1="120" x2="120" y2="160" stroke="#16A34A" stroke-width="3"/>
  <text x="130" y="140" font-family="Arial" font-size="10" fill="#16A34A" text-anchor="start">L2</text>
  
  <line x1="140" y1="120" x2="140" y2="160" stroke="#2563EB" stroke-width="3"/>
  <text x="150" y="140" font-family="Arial" font-size="10" fill="#2563EB" text-anchor="start">L3</text>
  
  <line x1="160" y1="120" x2="160" y2="160" stroke="#64748B" stroke-width="3"/>
  <text x="170" y="140" font-family="Arial" font-size="10" fill="#64748B" text-anchor="start">N</text>
  
  <line x1="180" y1="120" x2="180" y2="160" stroke="#D97706" stroke-width="3"/>
  <text x="190" y="140" font-family="Arial" font-size="10" fill="#D97706" text-anchor="start">PE</text>
  
  <!-- Connection box -->
  <rect x="200" y="150" width="100" height="60" rx="5" fill="#1B2A4A" opacity="0.8"/>
  <text x="250" y="180" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">Quadre</text>
  <text x="250" y="195" font-family="Arial" font-size="10" fill="#93C5FD" text-anchor="middle">Elèctric</text>
  
  <!-- Motor -->
  <circle cx="350" cy="180" r="40" fill="#E2E8F0" stroke="#1B2A4A" stroke-width="2"/>
  <text x="350" y="175" font-family="Arial" font-size="12" fill="#1B2A4A" text-anchor="middle">Motor</text>
  <text x="350" y="190" font-family="Arial" font-size="10" fill="#64748B" text-anchor="middle">0.12 kW</text>
  
  <!-- Connections -->
  <line x1="300" y1="180" x2="310" y2="180" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="390" y1="180" x2="400" y2="180" stroke="#1B2A4A" stroke-width="2"/>
  
  <!-- Ground -->
  <line x1="180" y1="160" x2="180" y2="300" stroke="#D97706" stroke-width="2"/>
  <line x1="160" y1="160" x2="200" y2="300" stroke="#D97706" stroke-width="2"/>
  <text x="180" y="320" font-family="Arial" font-size="10" fill="#D97706" text-anchor="middle">Terra (PE)</text>
  
  <!-- Notes -->
  <rect x="50" y="350" width="400" height="40" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="250" y="370" font-family="Arial" font-size="11" fill="#1B2A4A" text-anchor="middle">Verificar seqüència de fases abans de l'encesa</text>
  <text x="250" y="385" font-family="Arial" font-size="10" fill="#64748B" text-anchor="middle">Utilitzar multímetre per verificar continuïtat</text>
</svg>
