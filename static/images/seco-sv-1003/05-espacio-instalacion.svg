<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none" font-family="Arial, sans-serif">
  <rect width="500" height="200" fill="#F8FAFC"/>
  <text x="250" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B2A4A">Condiciones de instalación — Espacio mínimo</text>
  <!-- Machine -->
  <rect x="180" y="60" width="140" height="80" rx="6" fill="#1B2A4A" stroke="#0F172A" stroke-width="1"/>
  <text x="250" y="105" text-anchor="middle" fill="white" font-size="11" font-weight="bold">SECO</text>
  <!-- Clearance arrows -->
  <!-- Left -->
  <line x1="155" y1="100" x2="178" y2="100" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="166" y="95" text-anchor="middle" fill="#2563EB" font-size="9">~2 cm</text>
  <!-- Right -->
  <line x1="322" y1="100" x2="345" y2="100" stroke="#2563EB" stroke-width="1.5"/>
  <text x="334" y="95" text-anchor="middle" fill="#2563EB" font-size="9">~2 cm</text>
  <!-- Top -->
  <line x1="250" y1="35" x2="250" y2="58" stroke="#2563EB" stroke-width="1.5"/>
  <text x="260" y="50" fill="#2563EB" font-size="9">~2 cm</text>
  <!-- Maintenance zone -->
  <rect x="180" y="155" width="140" height="30" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="250" y="174" text-anchor="middle" fill="#92400E" font-size="9">Zona de mantenimiento</text>
  <!-- Labels -->
  <text x="250" y="195" text-anchor="middle" fill="#64748B" font-size="8">Vista superior — Posición horizontal (max 1° desviación)</text>
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
</svg>
