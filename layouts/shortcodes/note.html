<div class="techdoc-note" style="border-left: 4px solid #2563EB; background: #EFF6FF; padding: 1rem 1.25rem; margin: 1.5rem 0; border-radius: 0 0.375rem 0.375rem 0;">
  <div class="techdoc-note__header" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
    <span class="techdoc-note__icon" style="color: #2563EB; font-weight: bold;">ℹ</span>
    <strong class="techdoc-note__title" style="color: #2563EB; text-transform: uppercase; font-size: 0.875rem; letter-spacing: 0.05em;">
      {{ i18n "note" }}
    </strong>
  </div>
  <div class="techdoc-note__content" style="color: #1E293B;">
    {{ .Inner | markdownify }}
  </div>
</div>
