<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" font-family="Arial, sans-serif">
  <rect width="600" height="400" fill="#F8FAFC"/>
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2A4A">SECO SV 1003 D / SV 1005 D — Vista general</text>
  <!-- Pump body -->
  <rect x="150" y="80" width="300" height="180" rx="8" fill="#1B2A4A" stroke="#0F172A" stroke-width="2"/>
  <text x="300" y="175" text-anchor="middle" fill="white" font-size="18" font-weight="bold">SECO</text>
  <text x="300" y="200" text-anchor="middle" fill="white" font-size="12">SV 1003 D / SV 1005 D</text>
  <!-- IN port -->
  <rect x="80" y="130" width="70" height="40" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="1"/>
  <text x="115" y="155" text-anchor="middle" fill="white" font-size="12" font-weight="bold">IN</text>
  <line x1="150" y1="150" x2="150" y2="150" stroke="#1D4ED8" stroke-width="2"/>
  <text x="115" y="190" text-anchor="middle" fill="#2563EB" font-size="10">Aspiración</text>
  <!-- OUT port -->
  <rect x="450" y="130" width="70" height="40" rx="4" fill="#DC2626" stroke="#B91C1C" stroke-width="1"/>
  <text x="485" y="155" text-anchor="middle" fill="white" font-size="12" font-weight="bold">OUT</text>
  <text x="485" y="190" text-anchor="middle" fill="#DC2626" font-size="10">Evacuación</text>
  <!-- Motor -->
  <rect x="220" y="280" width="160" height="50" rx="4" fill="#4B5563" stroke="#374151" stroke-width="1"/>
  <text x="300" y="310" text-anchor="middle" fill="white" font-size="11">Motor eléctrico</text>
  <!-- VA label -->
  <circle cx="200" cy="120" r="12" fill="#D97706" stroke="#B45309" stroke-width="1"/>
  <text x="200" y="124" text-anchor="middle" fill="white" font-size="10" font-weight="bold">VA</text>
  <line x1="212" y1="120" x2="250" y2="140" stroke="#D97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="255" y="135" fill="#D97706" font-size="9">Paleta</text>
  <!-- FW label -->
  <circle cx="400" cy="120" r="12" fill="#16A34A" stroke="#15803D" stroke-width="1"/>
  <text x="400" y="124" text-anchor="middle" fill="white" font-size="10" font-weight="bold">FW</text>
  <line x1="388" y1="120" x2="350" y2="140" stroke="#16A34A" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="290" y="135" fill="#16A34A" font-size="9">Arandela fieltro</text>
  <!-- Legend -->
  <rect x="30" y="350" width="540" height="40" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="368" fill="#64748B" font-size="9">IN = Conexión de entrada</text>
  <text x="240" y="368" fill="#64748B" font-size="9">OUT = Conexión de aire escape</text>
  <text x="430" y="368" fill="#64748B" font-size="9">VA = Paleta | FW = Arandela de fieltro</text>
</svg>
